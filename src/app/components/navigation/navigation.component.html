<header class="fixed inset-x-0 top-0 z-[1000] px-3 sm:px-5 pt-3 sm:pt-4">
  <nav
    class="mx-auto max-w-site flex items-center justify-between gap-4 rounded-full pl-4 pr-2 sm:pl-6 sm:pr-2.5 py-2 transition-all duration-500"
    [ngClass]="isScrolled() || isMenuOpen()
      ? 'bg-white/80 backdrop-blur-xl shadow-[0_10px_40px_-20px_rgba(44,44,44,.35)] ring-1 ring-ink/5'
      : 'bg-white/40 backdrop-blur-md ring-1 ring-white/60'"
    aria-label="Hauptnavigation">

    <!-- Logo -->
    <a routerLink="/" class="flex items-center gap-2.5 text-ink-900 shrink-0 group" aria-label="Crown Motion – Startseite">
      <span class="transition-transform duration-500 group-hover:-rotate-6">
        <app-crown-mark [size]="30"></app-crown-mark>
      </span>
      <span class="font-serif text-lg sm:text-xl tracking-tight leading-none">
        Crown <span class="italic text-blush-500">Motion</span>
      </span>
    </a>

    <!-- Desktop-Links -->
    <ul class="hidden lg:flex items-center gap-1 list-none m-0 p-0">
      @for (item of items; track item.link) {
        <li>
          <a [routerLink]="item.link"
             routerLinkActive="!bg-blush-100 !text-ink-900"
             [routerLinkActiveOptions]="{ exact: item.link === '/' }"
             class="block px-4 py-2 rounded-full text-[0.9rem] font-medium text-ink-700 transition-colors duration-300 hover:text-ink-900 hover:bg-white/70">
            {{ item.label }}
          </a>
        </li>
      }
    </ul>

    <div class="flex items-center gap-2">
      <a routerLink="/kontakt" class="hidden sm:inline-flex btn btn-primary !py-2.5 !px-5 text-sm">
        Kontakt <span class="btn-arrow">→</span>
      </a>

      <!-- Mobile-Toggle -->
      <button
        type="button"
        class="lg:hidden relative w-11 h-11 rounded-full bg-ink text-white flex items-center justify-center"
        (click)="toggleMenu()"
        [attr.aria-expanded]="isMenuOpen()"
        aria-controls="mobile-menu"
        [attr.aria-label]="isMenuOpen() ? 'Menü schließen' : 'Menü öffnen'">
        <span class="absolute w-4 h-[1.5px] bg-current transition-transform duration-300"
              [ngClass]="isMenuOpen() ? 'rotate-45' : '-translate-y-[4px]'"></span>
        <span class="absolute w-4 h-[1.5px] bg-current transition-transform duration-300"
              [ngClass]="isMenuOpen() ? '-rotate-45' : 'translate-y-[4px]'"></span>
      </button>
    </div>
  </nav>
</header>

<!-- Mobile-Menü (Vollbild) -->
<div id="mobile-menu"
     class="lg:hidden fixed inset-0 z-[999] overflow-hidden bg-blush-100 grain transition-[clip-path] duration-700 ease-[cubic-bezier(.7,0,.2,1)]"
     [style.clip-path]="isMenuOpen() ? 'circle(150% at calc(100% - 40px) 40px)' : 'circle(0% at calc(100% - 40px) 40px)'"
     [attr.aria-hidden]="!isMenuOpen()"
     [attr.inert]="isMenuOpen() ? null : ''">
  <div class="pointer-events-none absolute -bottom-24 -right-24 w-96 h-96 rounded-full bg-blush-300/70 blur-3xl"></div>

  <div class="relative h-full flex flex-col justify-between px-6 sm:px-10 pt-28 pb-10 overflow-y-auto">
    <ul class="list-none m-0 p-0 space-y-1">
      @for (item of items; track item.link; let i = $index) {
        <li class="overflow-hidden">
          <a [routerLink]="item.link"
             routerLinkActive="!text-blush-500 italic"
             [routerLinkActiveOptions]="{ exact: item.link === '/' }"
             class="flex items-baseline gap-4 py-1.5 font-serif text-[2.6rem] sm:text-6xl leading-tight text-ink-900 transition-all duration-700"
             [style.transition-delay]="isMenuOpen() ? (120 + i * 60) + 'ms' : '0ms'"
             [ngClass]="isMenuOpen() ? 'translate-y-0 opacity-100' : 'translate-y-full opacity-0'">
            <span class="font-sans text-xs font-semibold tracking-eyebrow text-ink-500 not-italic">0{{ i + 1 }}</span>
            {{ item.label }}
          </a>
        </li>
      }
    </ul>

    <div class="mt-10 space-y-6">
      <a routerLink="/kontakt" class="btn btn-primary w-full">Kontakt aufnehmen <span class="btn-arrow">→</span></a>
      <div class="flex items-center justify-between text-sm text-ink-500">
        <a href="mailto:crown.motion@gmx.at" class="link-underline">crown.motion&#64;gmx.at</a>
        <a href="https://www.instagram.com/emily_henle/" target="_blank" rel="noopener" class="link-underline">Instagram</a>
      </div>
    </div>
  </div>
</div>
